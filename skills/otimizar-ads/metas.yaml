# ============================================================================
# Otimizar Ads — Metas por Cliente
# ============================================================================
#
# Este arquivo é o que dá poder de decisão ao agente.
#
# As Quality Gates do ads-ratos são TODAS relativas à meta:
#   "CPA > 3x a meta"  →  sem meta, não existe kill rule.
#
# Enquanto `cpa_meta` estiver null, o agente cai no benchmark do nicho
# (references/benchmarks-br.md) e MARCA a recomendação como
# "baseada em benchmark, não na meta real do cliente".
#
# Preencher aos poucos. Cada cliente preenchido = decisões mais confiáveis.
#
# Campos:
#   nicho          — chave pros benchmarks (leads, e-commerce, servicos, educacao)
#   objetivo       — leads | vendas | trafego
#   cpa_meta       — custo por lead/venda aceitável, em R$
#   cpa_teto       — acima disso, pausar (default: 3x cpa_meta)
#   roas_meta      — só pra objetivo=vendas
#   budget_mensal  — verba total contratada, em R$
#   ticket_medio   — ajuda o agente a julgar se o CPA faz sentido
#
# ============================================================================

