<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório {{PLATAFORMA}} — {{CLIENTE}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #00002c;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      padding: 48px 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 48px;
      padding-bottom: 32px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header-left h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .header-left .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-weight: 400;
    }
    .header-right {
      text-align: right;
    }
    .logo {
      height: 36px;
      margin-bottom: 8px;
      display: block;
      margin-left: auto;
    }
    .periodo-badge {
      display: inline-block;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
    }

    /* Section title */
    .section-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 16px;
      margin-top: 40px;
    }

    /* Metrics principais */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 8px;
    }
    .metric-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px;
    }
    .metric-card .label {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .metric-card .value {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .metric-card .variation {
      font-size: 12px;
      margin-top: 6px;
    }
    .variation.up { color: #4ade80; }
    .variation.down { color: #f87171; }
    .variation.neutral { color: rgba(255,255,255,0.4); }

    /* Métricas secundárias */
    .secondary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .secondary-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .secondary-card .metric-name {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 4px;
    }
    .secondary-card .metric-val {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .secondary-card .analysis {
      font-size: 12px;
      color: rgba(255,255,255,0.65);
      line-height: 1.5;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .status-ok { background: #4ade80; }
    .status-warn { background: #facc15; }
    .status-alert { background: #f87171; }

    /* Sugestões */
    .sugestoes-list {
      list-style: none;
      counter-reset: sugestao-counter;
    }
    .sugestoes-list li {
      counter-increment: sugestao-counter;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sugestoes-list li:last-child { border-bottom: none; }
    .sugestoes-list li::before {
      content: counter(sugestao-counter, decimal-leading-zero);
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.2);
      min-width: 24px;
      padding-top: 2px;
    }
    .sugestoes-list li .text {
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      line-height: 1.5;
    }
    .sugestoes-list li .text strong {
      color: #ffffff;
      font-weight: 600;
    }

    /* Comparação período */
    .comparacao-table {
      width: 100%;
      border-collapse: collapse;
    }
    .comparacao-table th {
      text-align: left;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .comparacao-table td {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .comparacao-table tr:last-child td { border-bottom: none; }

    /* Footer */
    .footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer .generated {
      font-size: 11px;
      color: rgba(255,255,255,0.2);
    }
    .footer .platform-badge {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      padding: 3px 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <h1>{{CLIENTE}}</h1>
      <div class="subtitle">{{PLATAFORMA}}</div>
    </div>
    <div class="header-right">
      <img src="../../../../../marca/logoarttico.png" alt="Arttico" class="logo">
      <span class="periodo-badge">{{PERIODO_LABEL}}</span>
    </div>
  </div>

  <!-- Métricas principais -->
  <div class="section-title">Métricas principais</div>
  <div class="metrics-grid">
    {{METRICAS_PRINCIPAIS}}
  </div>

  <!-- Métricas secundárias -->
  <div class="section-title">Análise detalhada</div>
  <div class="secondary-grid">
    {{METRICAS_SECUNDARIAS}}
  </div>

  <!-- Comparação período anterior -->
  {{COMPARACAO}}

  <!-- Sugestões -->
  <div class="section-title">Ações recomendadas</div>
  <ul class="sugestoes-list">
    {{SUGESTOES}}
  </ul>

  <div class="footer">
    <span class="generated">Gerado em {{DATA_GERACAO}} · Grupo Arttico</span>
    <span class="platform-badge">{{PLATAFORMA}}</span>
  </div>

</body>
</html>
